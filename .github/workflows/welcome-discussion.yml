name: Discussion de bienvenue (ponctuelle)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/welcome-discussion.yml']
permissions:
  discussions: write
  contents: read
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Bienvenue – à lire avant d’écrire"
          read -r REPO_ID CAT_ID EXISTS <<< "$(gh api graphql -f query='query{repository(owner:"rodtrip2",name:"ma-boussole-bien-etre"){id discussionCategories(first:20){nodes{id name}} discussions(first:50){nodes{title}}}}' \
            --jq '.data.repository as $r | [$r.id, ([$r.discussionCategories.nodes[] | select(.name=="Announcements" or .name=="Annonces")][0].id // $r.discussionCategories.nodes[0].id), ([$r.discussions.nodes[] | select(.title=="Bienvenue – à lire avant d’écrire")] | length)] | @tsv')"
          echo "repo=$REPO_ID cat=$CAT_ID exists=$EXISTS"
          if [ "$EXISTS" != "0" ]; then echo "Déjà créée"; exit 0; fi
          gh api graphql -f query='mutation($r:ID!,$c:ID!,$t:String!,$b:String!){createDiscussion(input:{repositoryId:$r,categoryId:$c,title:$t,body:$b}){discussion{url}}}' \
            -f r="$REPO_ID" -f c="$CAT_ID" -f t="$TITLE" -f b="$(cat .github/welcome/bienvenue.md)" --jq '.data.createDiscussion.discussion.url'
